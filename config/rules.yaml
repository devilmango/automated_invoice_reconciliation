# Percentages are relative to the expected value. Currency rates convert each
# document currency into base_currency; keep these rates current in production.
rules:
  quantity_variance:
    tolerance: 2%
  price_variance:
    tolerance: 1%
  tax_variance:
    tolerance: 0.5%
  currency:
    base_currency: USD
    minor_units:
      USD: 2
      EUR: 2
      JPY: 0
      KWD: 3
    rates_to_base:
      USD: 1
      EUR: 1.08
      JPY: 0.0067
      KWD: 3.25
  amount_variance:
    tolerance: 0.5%
  quantity_units:
    EA: {family: count, to_base: 1}
    EACH: {family: count, to_base: 1}
    DZ: {family: count, to_base: 12}
    CASE: {family: count, to_base: 12}
    KG: {family: mass, to_base: 1}
    G: {family: mass, to_base: 0.001}
    LB: {family: mass, to_base: 0.45359237}
    L: {family: volume, to_base: 1}
    ML: {family: volume, to_base: 0.001}
  approval:
    auto_approve_matches: false
    policies:
      - name: high-value-two-step
        min_invoice_total: 10000
        required_role: admin
        approvals_required: 2
        sla_hours: 24
      - name: default
        required_role: approver
        approvals_required: 1
        sla_hours: 72
