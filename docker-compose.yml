services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://invoice_match:invoice_match@db:5432/invoice_match
      ACCOUNTING_CONNECTIONS_ENCRYPTION_KEY: "${ACCOUNTING_CONNECTIONS_ENCRYPTION_KEY:-}"
      INVOICE_MATCH_RULES: /app/config/rules.yaml
      REVIEWER_TOKENS: "${REVIEWER_TOKENS:?Set REVIEWER_TOKENS in .env; see .env.example}"
      INTEGRATION_TOKENS: "${INTEGRATION_TOKENS:?Set INTEGRATION_TOKENS in .env; see .env.example}"
      AP_ADAPTER_URL: "${AP_ADAPTER_URL:-}"
      AP_ADAPTER_TOKEN: "${AP_ADAPTER_TOKEN:-}"
      AP_ADAPTER_DIRECTORY: /var/lib/invoice-match/ap-adapter-data
      AP_PROCUREMENT_ADAPTER: "${AP_PROCUREMENT_ADAPTER:-filesystem}"
      AP_DELIVERY_ADAPTER: "${AP_DELIVERY_ADAPTER:-filesystem}"
      AP_RETRY_MAX_ATTEMPTS: "${AP_RETRY_MAX_ATTEMPTS:-8}"
      AP_RETRY_INITIAL_SECONDS: "${AP_RETRY_INITIAL_SECONDS:-30}"
      AP_RETRY_MAX_SECONDS: "${AP_RETRY_MAX_SECONDS:-3600}"
      NOTIFICATION_RETRY_MAX_ATTEMPTS: "${NOTIFICATION_RETRY_MAX_ATTEMPTS:-8}"
      NOTIFICATION_RETRY_INITIAL_SECONDS: "${NOTIFICATION_RETRY_INITIAL_SECONDS:-30}"
      NOTIFICATION_RETRY_MAX_SECONDS: "${NOTIFICATION_RETRY_MAX_SECONDS:-3600}"
      DELIVERY_WORKER_NAME: "${DELIVERY_WORKER_NAME:-invoice-match-worker}"
      INVOICE_MATCH_API_URL: http://127.0.0.1:8000
      INVOICE_MATCH_INTEGRATION_TOKEN: "${INVOICE_MATCH_INTEGRATION_TOKEN:-}"
      INVOICE_MATCH_CAPTURE_INBOX_DIRECTORY: /var/lib/invoice-match/invoice-inbox
      NOTIFICATION_WEBHOOK_URL: "${NOTIFICATION_WEBHOOK_URL:-}"
      NOTIFICATION_WEBHOOK_TOKEN: "${NOTIFICATION_WEBHOOK_TOKEN:-}"
      NOTIFICATION_WEBHOOK_SECRET: "${NOTIFICATION_WEBHOOK_SECRET:-}"
      NOTIFICATION_WORKER_NAME: "${NOTIFICATION_WORKER_NAME:-scheduler}"
      QBO_CLIENT_ID: "${QBO_CLIENT_ID:-}"
      QBO_CLIENT_SECRET: "${QBO_CLIENT_SECRET:-}"
      QBO_REALM_ID: "${QBO_REALM_ID:-}"
      QBO_REFRESH_TOKEN: "${QBO_REFRESH_TOKEN:-}"
      QBO_TOKEN_ENCRYPTION_KEY: "${QBO_TOKEN_ENCRYPTION_KEY:-}"
      QBO_ENVIRONMENT: "${QBO_ENVIRONMENT:-sandbox}"
      QBO_VENDOR_ID_MAP: "${QBO_VENDOR_ID_MAP:-{}}"
      QBO_ITEM_ID_MAP: "${QBO_ITEM_ID_MAP:-{}}"
      QBO_TAX_CODE_MAP: "${QBO_TAX_CODE_MAP:-{}}"
      QBO_AP_ACCOUNT_ID: "${QBO_AP_ACCOUNT_ID:-}"
      QBO_FREIGHT_ACCOUNT_ID: "${QBO_FREIGHT_ACCOUNT_ID:-}"
      QBO_DISCOUNT_ACCOUNT_ID: "${QBO_DISCOUNT_ACCOUNT_ID:-}"
      XERO_CLIENT_ID: "${XERO_CLIENT_ID:-}"
      XERO_CLIENT_SECRET: "${XERO_CLIENT_SECRET:-}"
      XERO_TENANT_ID: "${XERO_TENANT_ID:-}"
      XERO_REFRESH_TOKEN: "${XERO_REFRESH_TOKEN:-}"
      XERO_TOKEN_ENCRYPTION_KEY: "${XERO_TOKEN_ENCRYPTION_KEY:-}"
      XERO_CONTACT_ID_MAP: "${XERO_CONTACT_ID_MAP:-{}}"
      XERO_ITEM_CODE_MAP: "${XERO_ITEM_CODE_MAP:-{}}"
      XERO_TAX_TYPE_MAP: "${XERO_TAX_TYPE_MAP:-{}}"
      XERO_EXPENSE_ACCOUNT_CODE: "${XERO_EXPENSE_ACCOUNT_CODE:-}"
    volumes:
      - ./config:/app/config:ro
      - ${AP_ADAPTER_DIRECTORY:-./ap-adapter-data}:/var/lib/invoice-match/ap-adapter-data
      - ${INVOICE_MATCH_CAPTURE_INBOX_DIRECTORY:-./invoice-inbox}:/var/lib/invoice-match/invoice-inbox
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: ["invoice-match", "worker", "--interval", "30"]
    environment:
      DATABASE_URL: postgresql+psycopg://invoice_match:invoice_match@db:5432/invoice_match
      ACCOUNTING_CONNECTIONS_ENCRYPTION_KEY: "${ACCOUNTING_CONNECTIONS_ENCRYPTION_KEY:-}"
      REVIEWER_TOKENS: "${REVIEWER_TOKENS:?Set REVIEWER_TOKENS in .env; see .env.example}"
      INTEGRATION_TOKENS: "${INTEGRATION_TOKENS:?Set INTEGRATION_TOKENS in .env; see .env.example}"
      AP_ADAPTER_DIRECTORY: /var/lib/invoice-match/ap-adapter-data
      AP_DELIVERY_ADAPTER: "${AP_DELIVERY_ADAPTER:-filesystem}"
      AP_RETRY_MAX_ATTEMPTS: "${AP_RETRY_MAX_ATTEMPTS:-8}"
      AP_RETRY_INITIAL_SECONDS: "${AP_RETRY_INITIAL_SECONDS:-30}"
      AP_RETRY_MAX_SECONDS: "${AP_RETRY_MAX_SECONDS:-3600}"
      NOTIFICATION_RETRY_MAX_ATTEMPTS: "${NOTIFICATION_RETRY_MAX_ATTEMPTS:-8}"
      NOTIFICATION_RETRY_INITIAL_SECONDS: "${NOTIFICATION_RETRY_INITIAL_SECONDS:-30}"
      NOTIFICATION_RETRY_MAX_SECONDS: "${NOTIFICATION_RETRY_MAX_SECONDS:-3600}"
      DELIVERY_WORKER_NAME: "${DELIVERY_WORKER_NAME:-invoice-match-worker}"
      NOTIFICATION_WEBHOOK_URL: "${NOTIFICATION_WEBHOOK_URL:-}"
      NOTIFICATION_WEBHOOK_TOKEN: "${NOTIFICATION_WEBHOOK_TOKEN:-}"
      NOTIFICATION_WEBHOOK_SECRET: "${NOTIFICATION_WEBHOOK_SECRET:-}"
      NOTIFICATION_WORKER_NAME: "${NOTIFICATION_WORKER_NAME:-scheduler}"
      QBO_CLIENT_ID: "${QBO_CLIENT_ID:-}"
      QBO_CLIENT_SECRET: "${QBO_CLIENT_SECRET:-}"
      QBO_REALM_ID: "${QBO_REALM_ID:-}"
      QBO_REFRESH_TOKEN: "${QBO_REFRESH_TOKEN:-}"
      QBO_TOKEN_ENCRYPTION_KEY: "${QBO_TOKEN_ENCRYPTION_KEY:-}"
      QBO_ENVIRONMENT: "${QBO_ENVIRONMENT:-sandbox}"
      QBO_VENDOR_ID_MAP: "${QBO_VENDOR_ID_MAP:-{}}"
      QBO_ITEM_ID_MAP: "${QBO_ITEM_ID_MAP:-{}}"
      QBO_TAX_CODE_MAP: "${QBO_TAX_CODE_MAP:-{}}"
      QBO_AP_ACCOUNT_ID: "${QBO_AP_ACCOUNT_ID:-}"
      QBO_FREIGHT_ACCOUNT_ID: "${QBO_FREIGHT_ACCOUNT_ID:-}"
      QBO_DISCOUNT_ACCOUNT_ID: "${QBO_DISCOUNT_ACCOUNT_ID:-}"
      XERO_CLIENT_ID: "${XERO_CLIENT_ID:-}"
      XERO_CLIENT_SECRET: "${XERO_CLIENT_SECRET:-}"
      XERO_TENANT_ID: "${XERO_TENANT_ID:-}"
      XERO_REFRESH_TOKEN: "${XERO_REFRESH_TOKEN:-}"
      XERO_TOKEN_ENCRYPTION_KEY: "${XERO_TOKEN_ENCRYPTION_KEY:-}"
      XERO_CONTACT_ID_MAP: "${XERO_CONTACT_ID_MAP:-{}}"
      XERO_ITEM_CODE_MAP: "${XERO_ITEM_CODE_MAP:-{}}"
      XERO_TAX_TYPE_MAP: "${XERO_TAX_TYPE_MAP:-{}}"
      XERO_EXPENSE_ACCOUNT_CODE: "${XERO_EXPENSE_ACCOUNT_CODE:-}"
    volumes:
      - ${AP_ADAPTER_DIRECTORY:-./ap-adapter-data}:/var/lib/invoice-match/ap-adapter-data
    depends_on:
      api:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: invoice_match
      POSTGRES_USER: invoice_match
      POSTGRES_PASSWORD: invoice_match
    ports:
      - "5432:5432"
    volumes:
      - invoice_match_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice_match -d invoice_match"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  invoice_match_data:
